px;border:1px solid #ae926044;pointer-events:none}.running,.kicker,.folio{font:10px system-ui;letter-spacing:.2em;text-transform:uppercase;text-align:center;color:#7f6758}.running{display:flex;align-items:center;gap:12px;justify-content:center}.running:before,.running:after{content:"";height:1px;background:#b59c7c70;flex:1}.front{text-align:center;display:flex;flex-direction:column;justify-content:space-between;gap:14px}.front h1{font-size:clamp(46px,4.9vw,75px);line-height:.96;font-weight:400;margin:12px 0 20px;letter-spacing:-.06em;color:#542e37}.orn{display:flex;align-items:center;justify-content:center;gap:11px;color:#a57f52;margin:12px auto}.orn:before,.orn:after{content:"";height:1px;width:42px;background:#b79c78}.intro,.reading{text-align:left;font-size:clamp(16px,1.36vw,19px);line-height:1.51}.intro p,.reading p{margin:0 0 .65em}.intro p:first-child:first-letter{float:left;font-size:3em;line-height:.89;padding:5px 6px 0 0;color:#74424a}.folio{position:absolute;bottom:16px;left:0;right:0}.reading{padding-top:24px}.page h2{font-size:30px;font-weight:400;line-height:1.15;color:#623b40;margin:18px 0}.leaf{min-height:min(67vw,630px)}.leaf:first-child{background:linear-gradient(90deg,#f3ead9 87%,#d6c6ad)}nav{display:flex;align-items:center;gap:22px;justify-content:center;margin-top:28px}nav button{width:44px;height:38px;border:1px solid #b58f7d77;background:#32232d;border-radius:24px;font-size:21px}nav button:disabled{opacity:.28;cursor:default}#position{font:13px system-ui;color:#dfc9bc}button:hover:enabled{filter:brightness(1.25)}dialog{width:min(390px,90vw);border:1px solid #ad8d73;border-radius:6px;padding:28px;background:#f2e9d8;color:#4b3034}dialog::backdrop{background:#150d16b8}dialog h2{font-size:32px;font-weight:400;margin:0 0 16px}.close{float:right;border:0;background:none;font-size:24px}#chapters button{display:block;width:100%;border:0;border-top:1px solid #b39a7959;padding:13px 0;background:none;text-align:left}.flip{animation:turn .28s ease-out}@key <script>const story = ["Эта история началась на Планете желаний, где жили звёзды. Они были разными, горели по-разному, но наша звезда зажглась ярче всех, и дали ему имя Вельмир.","Он не знал, что это значит, но родители задумали его имя как «Великий миротворец». Однако у него были другие планы.","Ведь 16 световых лет назад, когда наш герой только родился, их планета закончила свой цикл, и все, кроме него, сгорели. Родители выбросили его в космос, а на родной планете больше не осталось жизни.","И тогда он начал искать себя, пробовать себя в самом разном.","Наша подростковая звезда путешествовала, пока не встретила такую же сущность, как и он сам. У них было много общего, а его новый друг мечтал об одном:","— Я хочу создать прикольный мир! Лучший мир! Тут всегда будет веселье, не надо будет умирать!","Тогда Вельмир понял, что каждый раз, когда он пролетал рядом с планетой и кто-то загадывал желание, он исполнял его. Он слышал искреннюю благодарность и радость.","Тогда он не понимал, что в их глазах был всего лишь падающей звездой в тёмном небе и самым ярким явлением в жизни людей.","Но встреча с новым другом стала новым вдохновением для его любимого дела — быть звездой желаний.","— Эх, блин, ну что такое?! Ну что за народ?! Кто знал, что на Планете войны два народа не захотят мирно договориться, а будут истреблять друг друга… Ах, ну чёрт, что это такое?! Второй раз уже… Грёбаные тролли! Почему конфликты для них — это весело?!","Вельмир крутанул свой нимб с картами. С каждым оборотом появлялись карты с количеством живых планет. Из всех планет, что остались в этой галактике, неперечёркнутой была лишь одна.","— Блин, если это не поможет всё наладить, я не знаю, что делать! Я облетел 20 миллионов этих проклятых планет, но ни на одной не было такого, чтобы всё прошло гладко! Я просто хочу спокойный дом, в котором меня примут, в котором все будут счастливы…","От грусти Вельмира остальные карты упали, оставив лишь одну, а его улыбка и нимб дрожали и словно частично пропадали.","— Вот что, решено! Если я ещё раз прилечу и все опять окажутся несчастны, я просто откажусь от своей мечты!","Листок с последней планетой, оставшийся на нимбе, сгорел, и он полетел именно к ней…","Люди, которые не знали собственного горя, жили достаточно спокойно. Почему достаточно? Ну, между ними бывали конфликты, они что-то не могли поделить. Что такое «делить», Вельмир вообще не знал, но понимал, что жадность — это плохо. Уж опыт у него был. И… ну, думаю, не было бы этой истории, если бы всё прошло гладко…","Несмотря на то что люди вроде как старались поддерживать мир, они всё равно ссорились, мирились, а вот оставались ли старые обиды — вопрос…","«Кого волнуют чьи-то проблемы… Мы же тут вообще-то решать…» — всегда думал наш герой.","Когда он уже был совсем близко к планете, среди множества желаний самыми громкими оказались детские — невинные и простые. А их смех наполнял радостью и без того разбитого неудачами Вельмира.","Они благодарили его, хотя даже не знали его имени. Взрослые же часто не ценили чужих стараний и благодарили какую-то «СуДьБу», которую Вельмир ненавидел.","Он часто сталкивался и с теми, кто просто кричал от радости, не произнося ни одного внятного слова благодарности. Это приводило его в недоумение.","Или…","— Ох, спасибо судьбе, которая помогла нам! Мы так молились, чтобы у нашей девочки всё было хорошо…","Вельмир любил слышать подобное. Он слышал похвалу и радовался, когда одни ценили других.","Но когда его собственные заслуги приписывали «судьбе», он, словно обиженный ребёнок, не понимал, что это такое и какую злую шутку она с ним играет. Ведь эта самая «судьба» забирала у него любовь и благодарность, ради которых он обычно так старался.","— Опять эта «судьба»! Да что ж ты будешь делать?! ЭТО СДЕЛАЛ Я!","Вельмир не мог навредить людям. У них ведь были желания, а кто знает, что произойдёт, если он сам станет преградой для их исполнения…","И если вы думаете, что я буду нахваливать силы и ограничения этого измученного небесного нечто…","— Я ВСЁ СЛЫШАЛ!","Да, но заткнись и не мешай! Это моя история о твоей жизни!","— …","Так вот, не угадали!","На Земле была девочка, которая хоть и видела, как у её друзей всё появлялось по одной мысли, сама ничего не загадывала. Она искала в этом подвох, но подвоха не было…","Первые люди, заметившие эту силу, стали испытывать её. Вельмир это видел и откладывал на дальнюю полку то, что должен был исполнить, но не хотел.","Он расставлял приоритеты, и когда люди поняли, что по какой-то причине исполняется не всё, большинство перестало пытаться.","Кто-то до сих пор пытался навредить друг другу, словно в битве телекинеза, а вот детские, простые желания или просьбы помочь другому Вельмир исполнял запросто.","Но таймер тикал, и этот шкаф рано или поздно мог разорваться…","Наша героиня, которую назвали родители Асей, знала беды как свои пять пальцев. Она была осторожная. Её учили, что те, кто предлагает что-то даром, никогда это не делают просто так. Они учили её, что у всего есть цена. Даже конфета от прохожего может ей показаться совсем не сладкой.","Может, поэтому она осторожна в общении со всеми, кто знает. Жила она с родителями в недостатках, иногда приходилось занимать, но это была крайность, потому что, как правило, может им обернуться хуже, чем обычно…","И вот в такой прекрасный, тёплый, не летний день…","— Это была осень, — сказал Вельмир, который решил показаться самым умным. — ЭЙ!","Кхм… Она гуляла по парку, и её единственный друг, который понял её природу и пытался доказать ей обратное, пришёл с вещью, пожелав её ночью.","— Ася, ты не представляешь, что я утром нашёл у кровати! Я хотел её больше года! — показывая новую машину Hot Wheels, которую показывал своей подруге при любом случае, когда её обложка попадалась ему на глаза. — Это чудо какое-то! Родители сказали, они не дарили.","— Подожди, подожди! Так не бывает! Мы тоже больше года хотели жить в достатке, и не выходит, а ты захотел машинку, и у тебя получилось? Бред! Ты хоть понимаешь, что это как минимум странно? Почему тебя это не настораживает?","— Вечно ты усложняешь… Ну, давай твоими словами объясню: сложились обстоятельства. А каким образом? Ну, хорошим… Лучше давай не брать в голову. Я слышал, бесплатный парк открылся недавно. Вроде его привезли ночью.","Бесплатный?! Ещё и парк?! Асе на секунду показалось, что Роману отключили мозг.","— Т… Ты серьёзно? Ты всегда пытался меня понять, спрашивал. Я надеялась, что ты понял, а тебе дай конфетку, так ты за фургоном побежишь! Нет уж! — та демонстративно притопнула ногой и, развернувшись, пошла домой.","— Ася, стой!.. — попытался он её окрикнуть, но она пошла дальше.","Но и дома её ожидал сюрприз. Она, девочка, имеющая свои желания, но всегда молчавшая про них родителям, зная, что у них и без неё проблем море и синий кит, пришла домой к полному столу еды и тумбочке оплаченных квитанций и долгов.","После её шока она слегка пришла в себя и потянула маму за рукав.","— Мам… Что это? Что это значит? У нас ещё один долг, да? Я не голодна, честно, не стоило… — она прекрасно понимала, что, когда дома много еды, потом им труднее после этого этапа.","— О чём ты говоришь, дурочка? Просто твоего отца повысили аж до заместителя его начальства. Он нам решил устроить сюрприз, — она смотрела на дочь, но та всё ещё в шоке, не может отпустить ситуацию… — Да, я понимаю, я сама удивлена, но теперь всё изменится.","Девочка могла понять, что отец получил то, ради чего трудом и потом получил, но ей показалось странным, что всё резко стало хорошо.","— Чудеса… — она вспомнила про друга, которого оставила, с мыслью, что обидела его, и, даже ничего не поев… — Мам, я ещё погуляю. Я правда не голодна.","— Хорошо, недолго только. И чтобы, когда пришла, всё съела.","Ася понимала, что мама говорит это не потому, что та привереда, а чтобы она больше не была осторожной и запасливой.","Когда девочка пришла туда, где оставила друга, заметила, что его нет, и, вспомнив про парк, пошла искать его. Ну и сам парк в том числе.","Когда Ася пришла к воротам в парк, то первым, что слышала, были ребята, которые кричали о том, что это лучший день в их жизни, наконец-то сбылась мечта.","А на фонтане красовалась фигура из камня — парня с Сатурном вместо головы, а на руках были довольные дети. Ближе к ногам, на земле, стояли взрослые, радостные, улыбающиеся.","Ася подошла к фонтану, посмотрела на табличку основания фонтана.","— Мечты сбываются… — девочка не успела дочитать, как вздрогнула от громкоговорителя по всему парку, но звук будто из каждой такой статуи в парке.","— Леди и джентльмены, юные красавицы и красавцы! Сегодняшний парк работает до того времени, пока позволяют правила ночного времени. Но не бойтесь, наш парк работает без выходных, и мы получили для него лучшее место, чтобы он остался тут в любое время года. А если вам не спится и ночью, попробуйте наш удивительный ночной кинотеатр. Заинтриговал? Так почему бы взять своё нетерпеливое место и носить его по всему комплексу счастья?","Сказать, что она испугалась, — ничего не сказать. Во время обращения статуя, на которую она смотрела, сама начала вращаться, словно флюгер, на который приклеили цветок.","Судорожно она отошла от водопада.","— Как, блин, я мечтаю встретить этого Ромку, блин! — тут же столкнулась с ним лбом.","— Эй! Ну ты чего вообще делаешь? Вообще-то я думал, ты не придёшь, — он помог ей встать.","— Я на это тоже надеялась, но, как видишь, хочу извиниться.","— Ну так я жду, — тот положил руки в карман и, улыбаясь, смотрит на неё.","— Обойдёшься! Теперь уж голова из-за тебя болеть будет.","— Ася, ну ты снова… Пошли лучше гулять, тут даже вату дают бесплатно, розовую.","Он знал её слабости, и её это бесило. Как-то раз ей всё же удалось попробовать за всё её маленькое существование, и она уже почти забыла этот вкус. Взяла друга за руку и потащила его к ларьку.","— Ты же не хотела сыр из мышеловки.","— Я с тобой за компанию пришла. Если что-то случится, пойдёшь разбираться ты, — они оба поняли, что Ася несерьёзно это сказала.","И вроде бы, ну, всё хорошо. Что может произойти? Но всё же один конверт желаний упал с полки…","Колесо обвалилось. Родители, которые кричали за безопасность детей… Дети пропали. Кто-то задумался сказать: «Лишь бы колесо встало нормально». Колесо вернулось, как мячик, при этом никто не пострадал.","Кто-то просил, чтобы их ребёнок вернулся, а мама друга Аси увидела в новостях о том, что колесо упало в парке, и пожелала сама для себя, чтобы её сын был рядом.","Единственная, кто оказалась в неком убежище, — это сама девочка, у которой родители не знали о парке и не имели связи с новостями, кроме газеты.","Снаружи убежища было слышно, как статуя опять заговорила:","— Прошу прощения, я искренне извиняюсь за такую маленькую неприятную ситуацию. К счастью, никто не пострадал, всё работает как надо. Больше такого не повторится. В качестве компенсации подойдите к ларькам номер 7, 10, 25 и заберите эксклюзив парка — игрушки в виде нашей статуи за счёт заведения. И помните: тут желания сбываются!","У Аси мурашки по коже пробежали от того, что для администрации такой шок можно замять эксклюзивом. Хотя, если никто не пострадал, можно ли это назвать большой причиной, ради которой следует ненавидеть парк?","С этой мыслью героиня пошла по коридору к свету. Коридор кажется бесконечным, будто она идёт сквозь землю на другой конец. Был декор, куча сомнительных вещей, но больше всего ей понравились банки снов. Там были разноцветные огоньки, но она не решилась их трогать, особенно красный, и прошла мимо.","Чем глубже в коридор проходила маленькая героиня, тем ей казалось, что тут жил слишком странный человек, потому что имел столько не столько жутких вещей, а интересных для глаз.","Пройдя к свету, она заметила большой стол и стул. Кабинет был настолько огромен, будто это не комната огромная, а она — паучок на углу паутины.","Кабинет быстро подстроился под её размер. На столе была куча писем, которые сгорали по одному золотым огнём, а что-то горело красным, от которого дрожал шкаф, запертый в золотую цепь, будто со сказа, о котором ей говорили в школе.","Потом она заметила, что кто-то сидит в кресле. Он медленно повернулся к ней, и она увидела статую, но другого цвета. Сначала она подумала, что это игрушка, но потом…","— Привет и добро пожаловать в парк! Как ощущения? — кольцо его крутится, перебирая карты, и, когда он её сорвал, прочитал с неё: — Ага, тебя зовут Ася. Интересное имя, знаешь… Нет, не знаешь. Ты безумно интересная девочка. Расскажи, как можно быть такой искренней и доброй, при этом невозмутимой?","Планетоголовая сущность решила не идти вокруг да около. Достала из стола блокнот, на обложке которого было её фото. Она вздрогнула.","— Мне ты нравишься. Я тут день, а ты показываешь себя достаточно хорошо. Желания для других, переживаешь за родных, но всё равно не можешь принять то, что уже есть. Это интересно, в самом деле. Ты ведь сама жаловалась, что твоя жизнь идёт по наклонной. Почему ты не благодарна тому, кто исправил то, о чём молила твоя семья и ты сама? — его карты на кольце аж засияли. Он положил руку на сердце, улыбаясь ей.","— Ты кто? Почему ты так много обо мне знаешь? Ты владелец парка?","— Кто я? Наконец-то! Ура! За 16 тысяч лет, по вашим меркам, хоть кто-то спросил, как меня зовут, того, кто носит блюдо. Охренеть! — карты на его кольце танцевали друг с другом. — Вельмир, воля мира и просто существо, которое хочет, чтобы все были счастливы… Я всё ещё не верю, что кто-то спросил верного конфиросье его имя. Может, ты есть хочешь или пить? Тебе Млечный Путь, а может, мясо Большой Медведицы и эксклюзивной приправы — прах моей смерти? Но я недавно пробовал ваш перец — не отличить, прям один в один!","Пару хлопков — она сидела уже с вилкой и ножом. На тарелке кусок мяса из звёзд с «перцем» и стакан молока целой Вселенной.","— Прошу, может, не надо? — она понимает, что это перебор.","— Ещё как надо! Для меня много это значит. Это как для тебя день рождения. Ты же не хочешь, чтобы праздник обвалился?","Оттого, что она видела, что он искренне радуется, Ася попробовала. Ей, на удивление, понравилось.","Когда она доела свой необычный обед, она вернулась к теме.","— Спасибо. Так значит, Вельмир? И это твой парк? Ты необычный, ты не отсюда. Что ты тут вообще делаешь и почему твоё колесо упало?","— И тебе спасибо, что попробовала мою стряпню, — прокашлявшись, он начал: — С колесом вышло действительно плохо, но я тут не виноват. Парк и я выполняем желания по всему миру, по всей планете, если я тут. И я стараюсь честно сдерживать негативные желания, но тут, признаюсь, уронил. Но вы друг друга спасли.","Ася всё ещё не понимала, что тут не так, решила задать вопрос:","— Ты исполняешь желания? Есть ли цена твоих желаний?","Вельмир встал в ступор. Он убрал быстро посуду, посадил её щелчком пальца на кресло, дал ей блокнот и ручку, а сам лёг на кожаный диван.","— Понимаете, я единственный такой в своём роде. Я не встречал других, и когда я пролетал мимо, я исполнял желания. Обычно они были хорошие. И вообще, у меня есть возможность выполнить своё желание. Оно одно, перебить его нельзя. Я загадал выполнять все желания, сделать каждого счастливым. И, ну, у меня пока выходит, верно?","Ася рисует на блокноте Вельмира, думает о его словах.","— Так вот, я не виноват в том, что колесо упало. Его пожелали. Я читал письмо и увидел, как в нём желали, чтобы колесо раздавило одну семью, — Вельмир слегка всхлипнул, а кольцо провисло. — Я хотел запечатать желание, но оно выпало.","— Почему ты выполняешь даже плохие желания? Разве другие не загадывали, чтобы ты не исполнял плохое? — Ася сидела, смотрела на его кольцо и карандашом приподняла.","— Желание — штука хитрая. Одна неточность — и всё. Я не знал о существовании плохих желаний. Для меня дико, что кто-то желает кому-то смерти. У вас есть семьи, а я такой один, один, понимаешь? Я просто в ужасе. И ваши желания перекрывают друг друга, пока моё одно не может перестать исполняться. И моё желание даже не может закрыть моя смерть, потому что она тоже бы мешала, потому её нет…","— Кстати, про семью, ты не мог бы… — Ася вспомнила, что у него семьи нет. — Если хочешь, можешь пойти со мной. Думаю, отец будет рад встретить того, кто исполнил его желание и спас нашу семью.","Вельмир воодушевился. Он взял её на руки и появился посреди их дома. Родители испугались, взяли то, что было под рукой, и стояли, не шевелились. Они испугались за дочку.","— НЕТ! Стойте! Он хороший! — Вельмир отпустил девочку на пол. Она даже не пыталась отбежать от него, показывая, что она не врёт. — Он просто несчастен…","Родители не могли сказать ни слова. Всё, что говорит их дочь, и само существо — правда перед их глазами.","Они проверяли его. Он исполнил пару простых желаний, но дочь их быстро остановила, потому что она не хотела, чтобы те увлекались, как люди из рассказа Вельмира.","Отец долго не думал, пожал руку Вельмиру.","— Спасибо, что хотя бы ты оценил моё старание ради семьи.","— Ну что вы, я делаю то, что должен, как вы, — Вельмир снова засиял, и карты плясали на его кольце.","— Ой…","У Вельмира цепь треснула. Он обнял всю семью и перенёс их в свой кабинет. Цепь со шкафа лопнула, и письма, падая, начали гореть красным огнём, исполняя всё, что было в них.","— Спокойно, мы тут в безопасности. И если есть желание кого-то спасти — самое время!","Ася вспомнила про то, что в шкафу были плохие желания. Она решила сразу вернуть к себе друга с его семьёй.","— Ася, что вообще, чёрт пойми, происходит?! — её друг обнял её, вжался. — Почему деревья сверху горят?","Вельмир в панике. Его кольцо крутилось, карты горели.","— Всё пропало! Снова! — он паникует, но Ася обняла его. — Что ты…?","— У нас есть шанс всё исправить?","Вельмир плачет. Кольцо так же крутится от паники, а карты горят синим пламенем.","— Я не хочу терять то, что только что получил…","Вдруг кольцо стало золотым.","— Желание! Ну же, Ася, загадай! Ты очень умная, давай, загадай!","Вельмир погрузился в сон. Там он смотрел всю свою жизнь. Планета на самом деле не покончила с собой сразу. Он вспомнил, как с предателем пил чай посреди миров, его злость на судьбу, на первые неудачи, пустоту внутри него, которая излучала свет.","Проснулся он на другой, такой же планете, как Земля, на которую он прилетел в последний раз. Всё было целым, только ощутимо людей…","Меньше?","— Что… Что ты загадала?","— То, что хотел ты. Чтобы люди, которые ценят не только своих, но и проявляют уважение к другим, были вместе и дружили на одной планете.","Вельмир не сразу понял смысл, а когда понял, было поздно. Та планета была сломана, появилась новая, такая же, но остались только те, кто имеет счастье без жестокости.","— Вельмир, можно ещё одно желание?","— Какое? — тот нахмурился, явно устал что-то исполнять после того, как он привыкает к тишине.","— Будь моим другом. Стань человеком…","История — это не сказка, а глубокое море, в котором, возможно, есть большее, чем вы можете представить."];</script><script>const sections = [[0,"Планета желаний"],[15,"Последняя планета"],[32,"Ася"],[57,"Парк желаний"],[80,"Кабинет Вельмира"],[113,"Последнее желание"]];
const pages = [{kind:"cover"},{kind:"front",text:story.slice(0,2)}];
const starts = [1];
for (let s=0; s<sections.length; s++) {
  const end = sections[s+1]?.[0] ?? story.length;
  let group = [], size = 0;
  if (s) starts.push(pages.length);
  for(let i=Math.max(2,sections[s][0]); i<end; i++){
    if(group.length && size+story[i].length>840){
      pages.push({text:group,section:s}); group=[]; size=0;
    }
    group.push(story[i]); size+=story[i].length+26;
  }
  if(group.length) pages.push({text:group,section:s});
}

    const title=element("div","title"); title.append(element("span","kicker","Часть первая"),element("h1","","Звезда желаний"),element("div","orn","✧")); result.append(title);
  }
  const body=element("div",front?"intro":"reading");
  if(!front && starts[s]===i) body.append(element("h2","",sections[s][1]));
  for(const p of page.text) body.append(element("p","",p));
  result.append(body,element("span","folio",String(i))); return result;
}
function show(i,scroll=false){
  const step=mobile.matches?1:2;
  current=Math.floor(Math.min(pages.length-1,Math.max(0,i))/step)*step;
  book.replaceChildren(leaf(current));
  if(step===2 && current+1<pages.length) book.append(leaf(current+1));
  book.classList.remove("flip"); void book.offsetWidth; book.classList.add("flip");
  byId("position").textContent=current===0?(step===1?"Обложка":"Обложка  ·  1"):"Стр. "+current+(step===2 && current+1<pages.length?"–"+(current+1):"")+" из "+(pages.length-1);
  byId("prev").disabled=current===0; byId("next").disabled=current+step>=pages.length;
  try{localStorage.setItem("velmir-page",String(current));}catch{}
  if(scroll) window.scrollTo(0,0);
}
function turn(direction){show(current+direction*(mobile.matches?1:2),true)}
byId("next").onclick=()=>turn(1); byId("prev").onclick=()=>turn(-1);
byId("home").onclick=e=>{e.preventDefault();show(0,true)};
byId("contents").onclick=()=>menu.showModal(); menu.querySelector(".close").onclick=()=>menu.close();
sections.forEach((section,i)=>{const b=element("button","",section[1]); b.onclick=()=>{menu.close();show(starts[i],true)}; byId("chapters").append(b)});
document.addEventListener("keydown",e=>{if(menu.open)return;if(e.key==="ArrowRight")turn(1);if(e.key==="ArrowLeft")turn(-1)});
mobile.addEventListener("change",()=>show(current));
let firstTouch;
book.addEventListener("touchstart",e=>{firstTouch=e.touches[0]},{passive:true});
book.addEventListener("touchend",e=>{if(!firstTouch)return;const x=e.changedTouches[0].clientX-firstTouch.clientX,y=e.changedTouches[0].clientY-firstTouch.clientY;if(Math.abs(x)>65 && Math.abs(x)>2*Math.abs(y))turn(x<0?1:-1);firstTouch=null},{passive:true});
for(let i=1;i<=120;i++){const star=element("i","","✦");star.style.cssText="left:"+((i*137.53)%100)+"%;top:"+((i*i*17.13)%100)+"%;font-size:"+(i%9===0?11:4)+"px;opacity:"+(0.13+(i%5)*.09);document.querySelector(".sky").append(star)}
show(current);
</script></body></html>
